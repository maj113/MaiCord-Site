name: Deploy

# Builds the site with live release and CI data from maj113/MaiCord
# (build.py), draws the link preview cards (card.py) and publishes everything
# to GitHub Pages. The hourly run picks up new releases and CI results, and
# deploys only when the page changed. The custom domain (maicord.com) is set
# in Settings > Pages, not by a CNAME file.
#
# The plugin, theme and effect pages are built from the sample catalog
# (catalog-fixture.json, signed with a throwaway key, noindex) until the
# release. To publish the real catalog, change 'fixture' to 'live' in the
# CATALOG line below (or set the repository variable MAICORD_SITE_CATALOG to
# live). The live build verifies the catalog's signature under either public
# key in the repository variables MAICORD_PLUGIN_CATALOG_PUBLIC_KEY and
# MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY (the keys MaiCord compiles in, so a
# key rotation never stops the deploy; README.md has the release checklist).
# A manual run can pick the source for that run and, with deploy off, only
# build and check.
on:
  push:
    branches: [master]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      catalog:
        description: Catalog source for this run (default follows the CATALOG line)
        type: choice
        options: [default, fixture, live]
        default: default
      deploy:
        description: Deploy the result (turn off to build and check only)
        type: boolean
        default: true

env:
  CATALOG: "${{ (inputs.catalog != 'default' && inputs.catalog) || vars.MAICORD_SITE_CATALOG || 'fixture' }}"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the card renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check -r requirements.txt

      - name: Check the catalog key handling
        run: '"$RUNNER_TEMP/venv/bin/python" test_catalog_keys.py'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAICORD_CATALOG_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_PUBLIC_KEY }}
          MAICORD_CATALOG_NEXT_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY }}
        run: |
          echo "Catalog source: $CATALOG"
          if [ "$CATALOG" = live ]; then
            if [ -z "$MAICORD_CATALOG_KEY" ]; then
              echo "::error::Set the MAICORD_PLUGIN_CATALOG_PUBLIC_KEY repository variable (the catalog public key MaiCord compiles in) before building the live catalog."
              exit 1
            fi
            if [ -z "$MAICORD_CATALOG_NEXT_KEY" ]; then
              echo "::warning::The MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY repository variable is not set: a catalog signed with the next key would fail this build."
            fi
          fi
          "$RUNNER_TEMP/venv/bin/python" build.py --out _site --catalog "$CATALOG"

      # Pushes and manual runs deploy; a scheduled run deploys only when the
      # home page or a catalog listing differs from the live one (or the live
      # one is unreachable). A listing carries the catalog sequence, so a new
      # catalog index always changes it. A manual run with deploy off builds
      # and checks only.
      - name: Compare with the live site
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          changed=true
          if [ "$EVENT" = schedule ]; then
            changed=false
            for page in index.html plugins/index.html themes/index.html effects/index.html; do
              curl -fsS --max-time 20 "https://maicord.com/$page" -o "$RUNNER_TEMP/live.html" &&
                cmp -s "$RUNNER_TEMP/live.html" "_site/$page" || changed=true
            done
          elif [ "$DEPLOY" = false ]; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Deploy: $changed"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.compare.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
