name: Deploy

# Builds the site with live release and CI data from maj113/MaiCord
# (build.py), draws the link preview card with the same details (card.py) and
# publishes both to GitHub Pages. The hourly run picks up new
# releases and CI results, and deploys only when the page changed. The custom
# domain (maicord.com) is set in Settings > Pages, not by a CNAME file.
on:
  push:
    branches: [master]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the card renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check -r requirements.txt

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/venv/bin/python" build.py --out _site'

      # Pushes and manual runs always deploy; a scheduled run deploys only
      # when the page differs from the live one (or the live one is unreachable).
      - name: Compare with the live site
        id: compare
        env:
          EVENT: ${{ github.event_name }}
        run: |
          changed=true
          if [ "$EVENT" = schedule ] && curl -fsS --max-time 20 https://maicord.com/ -o "$RUNNER_TEMP/live.html" &&
             cmp -s "$RUNNER_TEMP/live.html" _site/index.html; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Deploy: $changed"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.compare.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
